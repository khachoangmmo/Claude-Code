<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng Ký — Mrbo Ads E-Learning</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23F97316'/><text x='50%' y='55%' text-anchor='middle' dominant-baseline='middle' font-size='18' font-weight='900' fill='white' font-family='Arial'>M</text></svg>">
</head>
<body>

<nav class="navbar" style="position:relative;backdrop-filter:none;background:var(--dark-800)">
  <div class="container">
    <div class="navbar-inner">
      <a href="/" class="navbar-logo">
        <div class="logo-icon">M</div>
        <span class="logo-text">Mrbo<span>Ads</span></span>
      </a>
      <a href="/login.html" style="font-size:0.85rem;color:var(--text-secondary)">
        Đã có tài khoản? <strong style="color:var(--primary)">Đăng nhập</strong>
      </a>
    </div>
  </div>
</nav>

<div class="auth-page">
  <div class="auth-card" style="max-width:480px">
    <div class="auth-logo">
      <div class="logo-icon" style="width:52px;height:52px;font-size:22px;margin:0 auto 12px">M</div>
      <h1 class="auth-title">Tạo tài khoản</h1>
      <p class="auth-sub">Miễn phí — Bắt đầu hành trình học Performance Marketing ngay hôm nay</p>
    </div>

    <!-- Benefits -->
    <div style="display:flex;gap:16px;margin-bottom:24px;padding:14px;background:rgba(249,115,22,0.06);border:1px solid rgba(249,115,22,0.15);border-radius:var(--radius-md)">
      <div style="font-size:0.78rem;color:var(--text-secondary);flex:1">
        <i class="fas fa-check" style="color:var(--accent-green);margin-right:4px"></i> Truy cập 5+ bài học miễn phí<br>
        <i class="fas fa-check" style="color:var(--accent-green);margin-right:4px"></i> Tham gia cộng đồng học viên
      </div>
      <div style="font-size:0.78rem;color:var(--text-secondary);flex:1">
        <i class="fas fa-check" style="color:var(--accent-green);margin-right:4px"></i> Nhận tài liệu học tập độc quyền<br>
        <i class="fas fa-check" style="color:var(--accent-green);margin-right:4px"></i> Giảm 20% cho lần đầu mua khóa học
      </div>
    </div>

    <div class="alert" id="alertMsg"></div>

    <form id="registerForm">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
        <div class="form-group" style="margin-bottom:0">
          <label class="form-label" for="name">Họ và tên</label>
          <div class="input-group">
            <i class="fas fa-user input-icon"></i>
            <input type="text" class="form-input" id="name" name="name" placeholder="Nguyễn Văn A" required />
          </div>
          <div class="form-error" id="nameError"></div>
        </div>
        <div class="form-group" style="margin-bottom:0">
          <label class="form-label" for="phone">Số điện thoại</label>
          <div class="input-group">
            <i class="fas fa-phone input-icon"></i>
            <input type="tel" class="form-input" id="phone" name="phone" placeholder="09xxxxxxxx" />
          </div>
        </div>
      </div>
      <div style="height:14px"></div>

      <div class="form-group">
        <label class="form-label" for="email">Email</label>
        <div class="input-group">
          <i class="fas fa-envelope input-icon"></i>
          <input type="email" class="form-input" id="email" name="email" placeholder="email@example.com" required autocomplete="email" />
        </div>
        <div class="form-error" id="emailError"></div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Mật khẩu</label>
        <div class="input-group" style="position:relative">
          <i class="fas fa-lock input-icon"></i>
          <input type="password" class="form-input" id="password" name="password" placeholder="Ít nhất 6 ký tự" required autocomplete="new-password" style="padding-right:42px" />
          <button type="button" id="togglePassword" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:0.85rem">
            <i class="fas fa-eye" id="eyeIcon"></i>
          </button>
        </div>
        <div class="form-error" id="passwordError"></div>
        <!-- Password strength -->
        <div id="passwordStrength" style="margin-top:8px;display:none">
          <div style="display:flex;gap:4px;margin-bottom:4px">
            <div class="strength-bar" style="height:3px;flex:1;border-radius:100px;background:var(--dark-500);transition:var(--transition)" id="s1"></div>
            <div class="strength-bar" style="height:3px;flex:1;border-radius:100px;background:var(--dark-500);transition:var(--transition)" id="s2"></div>
            <div class="strength-bar" style="height:3px;flex:1;border-radius:100px;background:var(--dark-500);transition:var(--transition)" id="s3"></div>
            <div class="strength-bar" style="height:3px;flex:1;border-radius:100px;background:var(--dark-500);transition:var(--transition)" id="s4"></div>
          </div>
          <span id="strengthText" style="font-size:0.72rem;color:var(--text-muted)"></span>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="confirmPassword">Xác nhận mật khẩu</label>
        <div class="input-group">
          <i class="fas fa-lock input-icon"></i>
          <input type="password" class="form-input" id="confirmPassword" name="confirmPassword" placeholder="Nhập lại mật khẩu" required autocomplete="new-password" />
        </div>
        <div class="form-error" id="confirmPasswordError"></div>
      </div>

      <div style="display:flex;align-items:flex-start;gap:8px;margin-bottom:20px">
        <input type="checkbox" id="terms" style="accent-color:var(--primary);cursor:pointer;margin-top:2px" required>
        <label for="terms" style="font-size:0.82rem;color:var(--text-secondary);cursor:pointer;line-height:1.5">
          Tôi đồng ý với <a href="#" style="color:var(--primary)">Điều Khoản Dịch Vụ</a> và
          <a href="#" style="color:var(--primary)">Chính Sách Bảo Mật</a> của Mrbo Ads
        </label>
      </div>

      <button type="submit" class="btn btn-primary w-100" id="submitBtn" style="padding:13px">
        <i class="fas fa-user-plus"></i>
        Tạo Tài Khoản Miễn Phí
      </button>
    </form>

    <p style="text-align:center;margin-top:20px;font-size:0.85rem;color:var(--text-muted)">
      Đã có tài khoản?
      <a href="/login.html" style="color:var(--primary);font-weight:600">Đăng nhập</a>
    </p>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script>
  if (Auth.isLoggedIn()) window.location.href = '/dashboard.html';

  // Toggle password
  document.getElementById('togglePassword').addEventListener('click', () => {
    const input = document.getElementById('password');
    const icon = document.getElementById('eyeIcon');
    input.type = input.type === 'password' ? 'text' : 'password';
    icon.className = input.type === 'password' ? 'fas fa-eye' : 'fas fa-eye-slash';
  });

  // Password strength checker
  document.getElementById('password').addEventListener('input', (e) => {
    const val = e.target.value;
    const strengthDiv = document.getElementById('passwordStrength');
    if (!val) { strengthDiv.style.display = 'none'; return; }
    strengthDiv.style.display = 'block';

    let score = 0;
    if (val.length >= 6)  score++;
    if (val.length >= 10) score++;
    if (/[A-Z]/.test(val) && /[a-z]/.test(val)) score++;
    if (/[0-9]/.test(val) && /[^A-Za-z0-9]/.test(val)) score++;

    const colors = ['#EF4444', '#F97316', '#F59E0B', '#10B981'];
    const labels = ['Yếu', 'Trung bình', 'Khá', 'Mạnh'];

    for (let i = 1; i <= 4; i++) {
      const bar = document.getElementById(`s${i}`);
      bar.style.background = i <= score ? colors[score - 1] : 'var(--dark-500)';
    }
    document.getElementById('strengthText').textContent = `Mật khẩu: ${labels[score - 1] || 'Rất yếu'}`;
    document.getElementById('strengthText').style.color = colors[score - 1] || '#EF4444';
  });

  // Form submit
  document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    const alertEl = document.getElementById('alertMsg');

    // Clear errors
    ['nameError','emailError','passwordError','confirmPasswordError'].forEach(id => {
      document.getElementById(id).classList.remove('show');
    });
    alertEl.className = 'alert';

    const name = document.getElementById('name').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    const terms = document.getElementById('terms').checked;

    let valid = true;
    if (!name || name.length < 2) {
      document.getElementById('nameError').textContent = 'Vui lòng nhập họ tên (ít nhất 2 ký tự).';
      document.getElementById('nameError').classList.add('show');
      valid = false;
    }
    if (!email || !/\S+@\S+\.\S+/.test(email)) {
      document.getElementById('emailError').textContent = 'Vui lòng nhập email hợp lệ.';
      document.getElementById('emailError').classList.add('show');
      valid = false;
    }
    if (!password || password.length < 6) {
      document.getElementById('passwordError').textContent = 'Mật khẩu phải có ít nhất 6 ký tự.';
      document.getElementById('passwordError').classList.add('show');
      valid = false;
    }
    if (password !== confirmPassword) {
      document.getElementById('confirmPasswordError').textContent = 'Mật khẩu xác nhận không khớp.';
      document.getElementById('confirmPasswordError').classList.add('show');
      valid = false;
    }
    if (!terms) {
      alertEl.className = 'alert alert-error show';
      alertEl.innerHTML = '<i class="fas fa-exclamation-circle"></i> Vui lòng đồng ý với điều khoản dịch vụ.';
      valid = false;
    }
    if (!valid) return;

    btn.disabled = true;
    btn.innerHTML = '<div class="loader"></div> Đang tạo tài khoản...';

    try {
      const data = await API.post('/auth/register', { name, email, password, phone });
      if (data.success) {
        Auth.setToken(data.token, data.user);
        alertEl.className = 'alert alert-success show';
        alertEl.innerHTML = '<i class="fas fa-check-circle"></i> Tạo tài khoản thành công! Đang chuyển trang...';
        setTimeout(() => window.location.href = '/dashboard.html', 1200);
      } else {
        alertEl.className = 'alert alert-error show';
        alertEl.innerHTML = `<i class="fas fa-exclamation-circle"></i> ${data.message}`;
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-user-plus"></i> Tạo Tài Khoản Miễn Phí';
      }
    } catch {
      alertEl.className = 'alert alert-error show';
      alertEl.innerHTML = '<i class="fas fa-exclamation-circle"></i> Lỗi kết nối. Vui lòng thử lại.';
      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-user-plus"></i> Tạo Tài Khoản Miễn Phí';
    }
  });
</script>
</body>
</html>
